<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hỏi đáp quy chế học vụ</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>Hỏi đáp quy chế học vụ</h1>
  <span id="status" class="status" title=""><span class="dot"></span><span class="text">Đang kiểm tra…</span></span>
  <a class="btn" href="/browse" title="Đọc toàn văn quy chế (Ctrl+K)">📖 <span class="text">Tra cứu</span></a>
  <button id="theme" class="btn icon" type="button" title="Đổi giao diện sáng/tối">◐</button>
  <button id="reset" class="btn" type="button">Hội thoại mới</button>
</header>

<main id="scroller">
  <div id="thread" class="wrap">
    <div id="empty" class="empty">
      <h2>Hỏi về quy chế học vụ</h2>
      <div>Câu trả lời lấy từ tài liệu trong hệ thống, kèm trích dẫn Điều/Khoản bấm được.</div>
      <div class="chips">
        <button class="chip" type="button">Thời gian đào tạo tối đa của hệ chính quy là bao nhiêu?</button>
        <button class="chip" type="button">Khi nào sinh viên bị cảnh báo học tập?</button>
        <button class="chip" type="button">Mỗi học kỳ được đăng ký tối đa bao nhiêu tín chỉ?</button>
        <button class="chip" type="button">Điều kiện được công nhận tốt nghiệp là gì?</button>
      </div>
    </div>
  </div>
</main>

<footer>
  <form id="form" class="composer">
    <textarea id="input" rows="1" placeholder="Nhập câu hỏi…" autofocus></textarea>
    <button id="send" class="send" type="submit">Gửi</button>
  </form>
  <div class="hint">Enter để gửi · Shift+Enter xuống dòng · <kbd>/</kbd> để vào ô nhập · <kbd>Esc</kbd> để dừng.
    Câu trả lời có thể sai — hãy mở trích đoạn nguồn để đối chiếu.</div>
</footer>

<script>
(() => {
  const HISTORY_MESSAGES = 6;              // last 3 user/assistant turns are sent as context
  const STORE_KEY = "regs-chat-v1";        // this browser only; never leaves the machine
  const STORE_MAX = 20;                    // messages kept across reloads
  const $ = (id) => document.getElementById(id);
  const thread = $("thread"), scroller = $("scroller"), input = $("input"), sendBtn = $("send");
  let history = [];
  let ready = false, busy = false, controller = null;

  // ---- theme: auto -> light -> dark ----
  const theme = {
    get: () => { try { return localStorage.getItem("regs-theme") || "auto"; } catch { return "auto"; } },
    set(v) {
      try { localStorage.setItem("regs-theme", v); } catch {}
      if (v === "auto") document.documentElement.removeAttribute("data-theme");
      else document.documentElement.setAttribute("data-theme", v);
      $("theme").title = { auto: "Theo hệ thống", light: "Giao diện sáng", dark: "Giao diện tối" }[v];
      $("theme").textContent = { auto: "◐", light: "☀", dark: "☾" }[v];
    },
  };
  theme.set(theme.get());
  $("theme").addEventListener("click", () => {
    const next = { auto: "light", light: "dark", dark: "auto" }[theme.get()];
    theme.set(next);
  });

  // ---- markdown ----
  // Small models sometimes append a recap line like "→ Đáp án: 12 học kỳ chính." despite the
  // prompt; drop it so the answer reads naturally.
  const stripRecap = (s) => String(s).replace(/^[ \t]*(?:[→⇒>\-–]+|=>)?[ \t]*\**[ \t]*Đáp án[ \t]*\**[ \t]*:.*$/gimu, "").trimEnd();
  const escapeHtml = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  // Built-in Markdown renderer (no CDN: the app must work offline). Handles what the model and
  // the excerpts use: paragraphs, bullets, numbered lists, tables, headings, bold, italic,
  // `code`. Input is escaped first, so no HTML gets through.
  function inline(s) {
    return escapeHtml(s)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[\s(])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>")
      .replace(/&lt;br&gt;/g, "<br>");
  }
  function md(text) {
    const lines = String(text).replace(/\r/g, "").split("\n");
    const out = [];
    let list = null;
    const closeList = () => { if (list) { out.push(`</${list}>`); list = null; } };
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i].trim();
      if (!line) { closeList(); continue; }
      if (line.startsWith("|") && i + 1 < lines.length && /^\|?\s*:?-{2,}/.test(lines[i + 1].trim())) {
        closeList();
        const cells = (l) => l.trim().replace(/^\||\|$/g, "").split("|").map((c) => inline(c.trim()));
        const head = cells(line);
        i += 1;
        const rows = [];
        while (i + 1 < lines.length && lines[i + 1].trim().startsWith("|")) rows.push(cells(lines[++i]));
        out.push("<table><thead><tr>" + head.map((c) => `<th>${c}</th>`).join("") + "</tr></thead><tbody>"
          + rows.map((r) => "<tr>" + r.map((c) => `<td>${c}</td>`).join("") + "</tr>").join("") + "</tbody></table>");
        continue;
      }
      let m;
      if ((m = line.match(/^(#{1,4})\s+(.*)$/))) { closeList(); const n = Math.min(m[1].length + 2, 6); out.push(`<h${n}>${inline(m[2])}</h${n}>`); continue; }
      if ((m = line.match(/^[-*+•o]\s+(.*)$/))) {
        if (list !== "ul") { closeList(); out.push("<ul>"); list = "ul"; }
        out.push(`<li>${inline(m[1])}</li>`); continue;
      }
      if ((m = line.match(/^(\d+)[.)]\s+(.*)$/)) && list === "ol") { out.push(`<li>${inline(m[2])}</li>`); continue; }
      if ((m = line.match(/^(\d+)[.)]\s+(.*)$/)) && /^\d+[.)]\s/.test((lines[i + 1] || "").trim())) {
        closeList(); out.push(`<ol start="${m[1]}">`); list = "ol"; out.push(`<li>${inline(m[2])}</li>`); continue;
      }
      closeList();
      out.push(`<p>${inline(line)}</p>`);
    }
    closeList();
    return out.join("");
  }

  // ---- citations ----
  // The model is told to cite "[Tên văn bản, Điều X]". Those brackets are turned into buttons
  // that open the matching excerpt; a citation naming an article that was never retrieved is
  // marked instead of quietly looking authoritative.
  const refOf = (s) => {
    let m = s.match(/Đi[eề]u\s*0*(\d+)/i);
    if (m) return "Điều " + Number(m[1]);
    m = s.match(/Ph[uụ]\s*l[uụ]c\s*0*(\d+)/i);
    return m ? "Phụ lục " + Number(m[1]) : null;
  };
  function linkifyCitations(root, sources) {
    if (!sources || !sources.length) return;
    const index = new Map();
    sources.forEach((s, i) => { if (s.article && !index.has(s.article)) index.set(s.article, i); });
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    const nodes = [];
    while (walker.nextNode()) if (walker.currentNode.nodeValue.includes("[")) nodes.push(walker.currentNode);
    for (const node of nodes) {
      const text = node.nodeValue;
      const frag = document.createDocumentFragment();
      let last = 0;
      for (const m of text.matchAll(/\[[^\[\]]{3,160}\]/g)) {
        const ref = refOf(m[0]);
        if (!ref) continue;
        frag.append(text.slice(last, m.index));
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = m[0];
        if (index.has(ref)) {
          btn.className = "cite";
          btn.dataset.src = index.get(ref);
          btn.title = "Mở trích đoạn nguồn";
        } else {
          btn.className = "cite dead";
          btn.title = "Trích dẫn này không nằm trong các trích đoạn đã dùng — hãy kiểm tra lại";
        }
        frag.append(btn);
        last = m.index + m[0].length;
      }
      if (!last) continue;
      frag.append(text.slice(last));
      node.replaceWith(frag);
    }
  }

  // ---- status ----
  async function pollHealth() {
    const el = $("status"), text = el.querySelector(".text");
    let msg, cls, detail = "";
    try {
      const r = await fetch("/health", { cache: "no-store" });
      const h = await r.json();
      detail = JSON.stringify(h, null, 2);
      if (h.ready) { msg = "Sẵn sàng · " + h.llm_model; cls = "ready"; }
      else if (h.ollama !== "ok") { msg = "Chưa kết nối được Ollama"; cls = "down"; }
      else if (String(h.embed_model).startsWith("missing")) { msg = "Đang tải model embedding…"; }
      else if (String(h.llm_model).includes("OPENAI_API_KEY")) { msg = "Thiếu OPENAI_API_KEY"; cls = "down"; }
      else if (String(h.llm_model).startsWith("missing")) { msg = "Đang tải model ngôn ngữ…"; }
      else if (h.qdrant !== "ok") { msg = "Chưa kết nối được Qdrant"; cls = "down"; }
      else if (!h.points) { msg = h.ingest === "running" ? "Đang nạp tài liệu…" : "Chưa có tài liệu (chưa ingest)"; }
      else { msg = "Chưa sẵn sàng"; }
      ready = !!h.ready;
    } catch {
      msg = "Đang khởi động…"; cls = "down"; ready = false;
    }
    el.className = "status " + (cls || "");
    text.textContent = msg;
    el.title = detail;
    updateSend();
    setTimeout(pollHealth, ready ? 30000 : 4000);
  }
  function updateSend() {
    sendBtn.disabled = busy ? false : (!ready || !input.value.trim());
    sendBtn.textContent = busy ? "Dừng" : "Gửi";
    sendBtn.title = ready ? "" : "Hệ thống chưa sẵn sàng";
  }

  // ---- rendering ----
  const scrollDown = () => { scroller.scrollTop = scroller.scrollHeight; };
  const pageLabel = (s) => (s.page_end && s.page_end !== s.page ? `trang ${s.page}–${s.page_end}` : `trang ${s.page}`);

  function addUser(text) {
    $("empty")?.remove();
    const row = document.createElement("div");
    row.className = "msg user";
    row.innerHTML = `<div class="bubble"></div>`;
    row.firstChild.textContent = text;
    thread.appendChild(row);
    scrollDown();
  }

  function addBot() {
    $("empty")?.remove();
    const row = document.createElement("div");
    row.className = "msg bot";
    row.innerHTML = `<div class="bubble">
      <div class="note" hidden></div>
      <div class="answer"><span class="thinking" role="status"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span class="label">Đang tra cứu tài liệu…</span></span></div>
      <div class="warnbox" hidden></div>
      <div class="toolbar" hidden></div>
      <div class="sources" hidden>
        <button class="srctoggle" type="button" aria-expanded="false">
          <span class="chev" aria-hidden="true">▸</span><span class="lbl">Nguồn tham khảo</span>
        </button>
        <div class="srclist" hidden></div>
      </div>
    </div>`;
    thread.appendChild(row);
    scrollDown();
    const bubble = row.querySelector(".bubble");
    bubble.addEventListener("click", (e) => {
      const cite = e.target.closest(".cite[data-src]");
      if (cite) { openSource(bubble, Number(cite.dataset.src)); return; }
      const toggle = e.target.closest(".srctoggle");
      if (toggle) showSources(bubble, toggle.getAttribute("aria-expanded") !== "true");
    });
    return {
      row, bubble,
      note: row.querySelector(".note"),
      answer: row.querySelector(".answer"),
      warn: row.querySelector(".warnbox"),
      toolbar: row.querySelector(".toolbar"),
      sources: row.querySelector(".sources"),
    };
  }

  // The source list starts collapsed: an answer is usually two lines and six sources, and
  // the sources pushed the next question off the screen. A citation click still works - it
  // opens the list on the way to the excerpt it points at.
  function showSources(bubble, open) {
    const toggle = bubble.querySelector(".srctoggle");
    const list = bubble.querySelector(".srclist");
    if (!toggle || !list) return;
    list.hidden = !open;
    toggle.setAttribute("aria-expanded", String(open));
  }

  function openSource(bubble, i) {
    showSources(bubble, true);
    const rows = bubble.querySelectorAll(".srcrow");
    const target = rows[i];
    if (!target) return;
    const btn = target.querySelector(".src");
    const panel = target.nextElementSibling;
    if (panel && panel.classList.contains("excerpt")) {
      panel.hidden = false;
      btn.setAttribute("aria-expanded", "true");
      panel.classList.remove("flash");
      void panel.offsetWidth;          // restart the highlight animation
      panel.classList.add("flash");
      panel.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }
  }

  function renderSources(box, sources) {
    const list = box.querySelector(".srclist");
    const label = box.querySelector(".srctoggle .lbl");
    list.replaceChildren();
    if (!sources || !sources.length) { box.hidden = true; return; }
    box.hidden = false;
    if (label) label.textContent = `Nguồn tham khảo (${sources.length})`;
    sources.forEach((s, i) => {
      const row = document.createElement("div");
      row.className = "srcrow";
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "src" + (s.origin === "context" ? " ctx" : "");
      btn.setAttribute("aria-expanded", "false");
      const context = s.origin === "context" ? ' <small>· ngữ cảnh bổ sung</small>' : "";
      btn.innerHTML = `<b>[${i + 1}]</b> ${escapeHtml(s.label || "")}`
        + (s.article_title ? " – " + escapeHtml(s.article_title) : "")
        + ` <small>· ${pageLabel(s)} · ${escapeHtml(s.doc_short_title || s.doc_title || "")}</small>${context}`;
      row.append(btn);
      if (s.doc_id) {
        const pdf = document.createElement("a");
        pdf.className = "pdf";
        pdf.href = `/source/${encodeURIComponent(s.doc_id)}#page=${s.page}`;
        pdf.target = "_blank";
        pdf.rel = "noopener";
        pdf.textContent = "PDF";
        pdf.title = `Mở bản gốc tại ${pageLabel(s)}`;
        row.append(pdf);
      }
      const panel = document.createElement("div");
      panel.className = "excerpt";
      panel.hidden = true;
      const refs = (s.source_refs || []).join("; ");
      panel.innerHTML = `<div class="meta">${escapeHtml(s.doc_title || "")} · ${pageLabel(s)}`
        + (refs ? " · Nguồn gốc: " + escapeHtml(refs) : "") + `</div>${md(s.text || "")}`;
      btn.onclick = () => {
        panel.hidden = !panel.hidden;
        btn.setAttribute("aria-expanded", String(!panel.hidden));
      };
      list.append(row, panel);
    });
  }

  function renderToolbar(view, { question, answer, sources, done }) {
    const bar = view.toolbar;
    bar.innerHTML = "";
    bar.hidden = false;
    const copy = document.createElement("button");
    copy.type = "button"; copy.className = "tool"; copy.textContent = "Sao chép";
    copy.onclick = async () => {
      try { await navigator.clipboard.writeText(answer); copy.textContent = "Đã chép ✓"; }
      catch { copy.textContent = "Không chép được"; }
      setTimeout(() => (copy.textContent = "Sao chép"), 1600);
    };
    bar.append(copy);
    if (question) {
      const again = document.createElement("button");
      again.type = "button"; again.className = "tool"; again.textContent = "Hỏi lại";
      again.onclick = () => { if (!busy && ready) ask(question, { regenerate: true }); };
      bar.append(again);
    }
    for (const [vote, glyph, title] of [["up", "👍", "Câu trả lời đúng"], ["down", "👎", "Câu trả lời sai hoặc thiếu"]]) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "tool"; b.textContent = glyph; b.title = title;
      b.onclick = () => {
        bar.querySelectorAll(".tool.on").forEach((x) => x.classList.remove("on"));
        b.classList.add("on");
        fetch("/feedback", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ vote, question, answer: answer.slice(0, 8000),
                                 sources: (sources || []).map((s) => `${s.article || ""} ${s.label || ""}`.trim()) }),
        }).catch(() => {});
      };
      bar.append(b);
    }
    if (done) {
      const meta = document.createElement("span");
      meta.className = "meta";
      const bits = [];
      if (done.latency_ms) bits.push(`${(done.latency_ms / 1000).toFixed(1)}s`);
      if (done.retrieval_ms) bits.push(`tra cứu ${done.retrieval_ms}ms`);
      if (sources && sources.length) bits.push(`${sources.length} trích đoạn`);
      meta.textContent = bits.join(" · ");
      bar.append(meta);
    }
  }

  function renderSuggestions(view, list) {
    if (!list || !list.length) return;
    const box = document.createElement("div");
    box.className = "chips";
    box.style.justifyContent = "flex-start";
    box.style.marginTop = "10px";
    for (const s of list) {
      const a = document.createElement("a");
      a.className = "chip";
      a.href = `/browse?article=${encodeURIComponent(s.article)}`;
      a.textContent = s.title ? `${s.article} – ${s.title}` : s.article;
      box.append(a);
    }
    const label = document.createElement("div");
    label.className = "note";
    label.textContent = "Có thể bạn đang tìm:";
    view.answer.append(label, box);
  }

  // ---- persistence (this browser only) ----
  const saved = [];
  function remember(entry) {
    saved.push(entry);
    while (saved.length > STORE_MAX) saved.shift();
    try { localStorage.setItem(STORE_KEY, JSON.stringify({ saved, history: history.slice(-HISTORY_MESSAGES) })); }
    catch {}
  }
  function restore() {
    let data;
    try { data = JSON.parse(localStorage.getItem(STORE_KEY) || "null"); } catch { return; }
    if (!data || !data.saved || !data.saved.length) return;
    history = data.history || [];
    for (const entry of data.saved) {
      saved.push(entry);
      if (entry.role === "user") { addUser(entry.text); continue; }
      const view = addBot();
      view.answer.innerHTML = md(entry.text);
      renderSources(view.sources, entry.sources);
      linkifyCitations(view.answer, entry.sources);
      renderToolbar(view, { question: entry.question, answer: entry.text,
                            sources: entry.sources, done: entry.done });
    }
    scrollDown();
  }

  // ---- SSE over fetch (POST) ----
  async function* sse(response) {
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {
        const raw = buf.slice(0, idx); buf = buf.slice(idx + 2);
        let event = "message", data = "";
        for (const line of raw.split("\n")) {
          if (line.startsWith("event:")) event = line.slice(6).trim();
          else if (line.startsWith("data:")) data += line.slice(5).trim();
        }
        yield { event, data: data ? JSON.parse(data) : null };
      }
    }
  }

  async function ask(text, opts = {}) {
    text = text.trim();
    if (!text || busy) return;
    busy = true; updateSend();
    if (!opts.regenerate) { addUser(text); remember({ role: "user", text }); }
    const view = addBot();
    let answer = "", sources = [], pending = false, finished = false, doneInfo = null;
    const paint = (final) => {
      if (finished && !final) return;
      if (final) finished = true;
      view.answer.innerHTML = md(stripRecap(answer || ""));
      view.answer.classList.toggle("cursor", !final);
      if (final) linkifyCitations(view.answer, sources);
      scrollDown();
    };
    controller = new AbortController();
    try {
      const resp = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, history: history.slice(-HISTORY_MESSAGES) }),
        signal: controller.signal,
      });
      if (!resp.ok) throw new Error(`HTTP ${resp.status}: ${await resp.text()}`);
      for await (const { event, data } of sse(resp)) {
        if (event === "query") {
          view.note.hidden = false;
          view.note.textContent = "Tra cứu với câu hỏi: " + data;
        } else if (event === "retrieved") {
          // Excerpts land before the first token, so the reader can start checking sources
          // while the model is still writing.
          sources = data.sources || [];
          renderSources(view.sources, sources);
          const label = view.answer.querySelector(".thinking .label");
          // "Đang đọc" rather than "Đã tìm thấy": at this point the excerpts are only the
          // closest ones, and whether any of them answers the question is not known yet.
          if (label) label.textContent = `Đang đọc ${sources.length} trích đoạn…`;
        } else if (event === "token") {
          answer += data;
          if (!pending) { pending = true; requestAnimationFrame(() => { pending = false; paint(false); }); }
        } else if (event === "sources") {
          sources = data || [];
          paint(true);
          renderSources(view.sources, sources);
          linkifyCitations(view.answer, sources);
        } else if (event === "done") {
          doneInfo = data;
        } else if (event === "error") {
          throw new Error(data && data.message);
        }
      }
      paint(true);
      const clean = stripRecap(answer);
      if (doneInfo && doneInfo.unsupported_citations && doneInfo.unsupported_citations.length) {
        view.warn.hidden = false;
        view.warn.textContent = "⚠ Câu trả lời trích dẫn " + doneInfo.unsupported_citations.join(", ")
          + " nhưng điều này không nằm trong các trích đoạn đã dùng. Hãy kiểm tra lại bản gốc.";
      }
      if (doneInfo && doneInfo.found === false) {
        if (doneInfo.read) {
          view.warn.hidden = false;
          view.warn.className = "warnbox info";
          view.warn.textContent = `Đã đọc ${doneInfo.read} trích đoạn gần nghĩa nhất nhưng `
            + `không đoạn nào trả lời được câu hỏi này, nên không có nguồn nào được dẫn.`;
        }
        renderSuggestions(view, doneInfo.suggestions);
      }
      renderToolbar(view, { question: text, answer: clean, sources, done: doneInfo });
      history.push({ role: "user", content: text }, { role: "assistant", content: clean });
      remember({ role: "bot", text: clean, sources, question: text, done: doneInfo });
    } catch (e) {
      if (e.name === "AbortError") {
        paint(true);
        if (answer) {
          const clean = stripRecap(answer);
          history.push({ role: "user", content: text }, { role: "assistant", content: clean });
          remember({ role: "bot", text: clean, sources, question: text, done: null });
        }
      } else {
        view.answer.classList.remove("cursor");
        view.answer.innerHTML = `<span class="error">Lỗi: ${escapeHtml(String(e.message || e))}</span>`;
      }
    } finally {
      busy = false; controller = null; updateSend(); input.focus();
    }
  }

  // ---- events ----
  $("form").addEventListener("submit", (e) => {
    e.preventDefault();
    if (busy) { controller?.abort(); return; }
    const text = input.value;
    input.value = ""; autosize();
    ask(text);
  });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("form").requestSubmit(); }
  });
  function autosize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 180) + "px"; updateSend(); }
  input.addEventListener("input", autosize);
  document.querySelectorAll(".chip").forEach((c) => c.addEventListener("click", () => { if (ready) ask(c.textContent); }));
  $("reset").addEventListener("click", () => {
    controller?.abort();
    try { localStorage.removeItem(STORE_KEY); } catch {}
    location.href = "/";
  });
  document.addEventListener("keydown", (e) => {
    const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName || "");
    if (e.key === "/" && !typing) { e.preventDefault(); input.focus(); }
    else if (e.key === "Escape" && busy) { controller?.abort(); }
    else if (e.key === "k" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); location.href = "/browse"; }
  });

  restore();
  pollHealth();
  // "Hỏi về Điều 37" on the browse page lands here as /?q=...; prefill rather than auto-send,
  // so the reader sees the question before it is asked.
  const prefill = new URLSearchParams(location.search).get("q");
  if (prefill) { input.value = prefill; autosize(); }
  input.focus();
})();
</script>
</body>
</html>
