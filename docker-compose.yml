# Three services: ollama (LLM + embeddings), qdrant (vectors), app (FastAPI on :8080).
# Models are pulled at runtime into the `ollama` volume, never baked into an image.
# start.sh adds `--profile ollama` unless a native Ollama is used (macOS, for Metal GPU).
# Only the app publishes a host port (APP_PORT, default 8080); ollama and qdrant stay on the
# compose network so they never clash with other stacks on the machine.
name: academic-regs-rag

services:
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.11.4}
    profiles: ["ollama"]
    volumes: ["ollama:/root/.ollama"]
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.15.1}
    volumes: ["qdrant:/qdrant/storage"]
    healthcheck:
      # the image has no curl/wget; probe the port with bash
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    env_file: [.env]
    environment:
      QDRANT_URL: http://qdrant:6333
      # start.sh exports this (container Ollama, native Ollama on macOS, or a custom URL).
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      # Cloud mode (./start.sh --cloud). The key comes from the shell environment at start.
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports: ["${APP_PORT:-8080}:8080"]
    volumes: ["./data:/srv/data"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/livez')"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  ollama:
  qdrant:
