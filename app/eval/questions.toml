# Golden set: a question, and the article(s) that actually answer it.
#
# `expect` lists every acceptable article - a question answered by either Điều 29 or Phụ lục 4
# lists both. Retrieval is correct if ANY of them comes back.
#
# Add a row whenever someone asks something the system got wrong; that is how this file earns
# its keep. data/logs/queries.jsonl (GET /metrics) shows what people actually ask.
#
#   docker compose exec app python -m app.eval.run
#   docker compose exec app python -m app.eval.run --compare

[[question]]
ask = "Thời gian đào tạo tối đa của hệ chính quy là bao nhiêu học kỳ?"
expect = ["Điều 5"]

